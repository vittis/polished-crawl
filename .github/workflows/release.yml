name: Release Polished Crawl
on:
  workflow_dispatch:
    inputs:
      preview_run:
        description: Publish the batch you tested (numeric Deploy preview run ID)
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'vittis/polished-crawl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Match the merged tree to the tested preview
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_RUN: ${{ inputs.preview_run }}
        run: |
          [[ "$PREVIEW_RUN" =~ ^[1-9][0-9]*$ ]]
          tested=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_RUN" --jq '
            select(.path == ".github/workflows/preview.yml" and .event == "push" and
                   .head_branch == "preview" and .head_repository.full_name == "vittis/polished-crawl" and
                   .conclusion == "success") | .head_sha')
          node tools/build/release-candidate.mjs "$tested"
          echo "Tested preview [run $PREVIEW_RUN]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PREVIEW_RUN) at \`$tested\`. Main merge: \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: candidate
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: polished-crawl-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
          cache: npm
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run test:deploy
      - run: npm run deploy:check -- --env=""
      - name: Publish or resume the release
        env:
          RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/build/publish-release.mjs

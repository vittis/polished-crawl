name: Release Polished Crawl
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version from the merged release PR (MAJOR.MINOR.PATCH)
        required: true
        type: string
      publish:
        description: Deploy to production and publish the GitHub Release
        default: false
        type: boolean
      source_sha:
        description: Full source commit SHA from the dry-run summary (required to publish)
        type: string

permissions:
  contents: write

concurrency:
  group: polished-crawl-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'vittis/polished-crawl' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.publish && 'production' || 'release-preview' }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Read release notes
        env:
          PUBLISH: ${{ inputs.publish }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          if [[ "$PUBLISH" == 'true' && ( "$GITHUB_ACTOR" != 'vittis' || "$TRIGGERING_ACTOR" != 'vittis' ) ]]; then
            echo 'The repository owner must dispatch the production release.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == 'true' && "$SOURCE_SHA" != "$GITHUB_SHA" ]]; then
            echo 'Publish requires the full SHA of this main commit from the dry-run summary.' >&2
            exit 1
          fi
          node tools/build/release-notes.mjs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"
          echo "RELEASE_TAG=v$RELEASE_VERSION" >> "$GITHUB_ENV"
      - run: npm ci --include=dev --prefer-offline --no-audit --no-fund
      - run: npm run test:deploy
      - run: npm run deploy:check
      - name: Verify packaged source link
        run: |
          grep -Fq "href=\"https://github.com/$GITHUB_REPOSITORY/tree/$RELEASE_TAG\"" apps/orbrun/dist/index.html
          {
            echo "## Polished Crawl $RELEASE_TAG"
            echo "Source commit \`$GITHUB_SHA\`"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check production configuration
        if: inputs.publish
        env:
          RELEASE_ENABLED: ${{ vars.PRODUCTION_RELEASE_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ "$RELEASE_ENABLED" != 'true' ]]; then
            echo 'Complete the Cloudflare cutover in project-notes/DEPLOYMENT.md before enabling production releases.' >&2
            exit 1
          fi
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in the production environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in the production environment}"
          if [[ ! "$CLOUDFLARE_API_TOKEN" =~ ^cfat_[a-zA-Z0-9_-]+$ ]]; then
            echo 'The production environment secret must contain one Cloudflare account API token.' >&2
            exit 1
          fi
      - name: Reserve the source tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --show-error --max-time 15 --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          if [[ "$status" != '404' ]]; then
            echo "Expected an unpublished $RELEASE_TAG. GitHub returned HTTP $status." >&2
            exit 1
          fi
          npm run deploy:guard
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo 'Dispatch the release again on the latest main.' >&2
            exit 1
          fi
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/tags/$RELEASE_TAG"
      - name: Deploy to Cloudflare
        if: inputs.publish
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy -- --tag "$RELEASE_TAG" --message "GitHub Actions release $GITHUB_SHA"
      - name: Confirm hosted release
        if: inputs.publish
        run: |
          expected="href=\"https://github.com/$GITHUB_REPOSITORY/tree/$RELEASE_TAG\""
          for attempt in {1..12}; do
            if html=$(curl --fail --silent --show-error --max-time 10 -H 'Cache-Control: no-cache' \
              "https://polished-crawl.com/?release=$RELEASE_TAG") && grep -Fq "$expected" <<< "$html"; then
              echo '[Production source link verified](https://polished-crawl.com/)' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "polished-crawl.com did not serve the expected source link for $RELEASE_TAG." >&2
          exit 1
      - name: Publish the GitHub Release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_url=$(gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Polished Crawl $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          echo "[GitHub Release]($release_url)" >> "$GITHUB_STEP_SUMMARY"
